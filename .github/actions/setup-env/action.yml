name: 'Setup Environment & Dependencies'
description: 'Sets up pnpm 12.8.1, Node.js 22 LTS, installs dependencies, and caches Playwright binaries'

inputs:
  node-version:
    description: 'Node.js version'
    required: false
    default: '22'
  install-playwright:
    description: 'Whether to cache and install Playwright browser binaries'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install pnpm Package Manager
      uses: pnpm/action-setup@v4
      with:
        version: 12.8.1

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Playwright Browsers
      id: playwright-cache
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright System Dependencies
      if: inputs.install-playwright == 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium

    - name: Install Playwright Browser (Chromium)
      if: inputs.install-playwright == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install chromium
