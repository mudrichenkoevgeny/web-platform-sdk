name: Release & Publish

on:
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish-npm:
    name: Publish Packages to npm (@mudrichenkoevgeny/web-platform-sdk-*)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        uses: ./.github/actions/setup-env

      - name: Update npm to latest (for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Build Packages
        run: pnpm build

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'packages/*/dist/*.{js,mjs,cjs}'

      - name: Publish Packages to npmjs.com
        run: pnpm -r publish --access public --provenance --no-git-checks

  publish-docs:
    name: Publish TypeDoc API Reference to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Environment & Dependencies
        uses: ./.github/actions/setup-env

      - name: Build Packages & Generate Declarations
        run: pnpm build

      - name: Generate TypeDoc API Documentation
        run: pnpm docs:generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/docs
