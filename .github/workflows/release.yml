name: Automated Release & Semantic Versioning

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release & Publish Packages (@mudrichenkoevgeny/web-platform-sdk-*)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      attestations: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment & Dependencies
        uses: ./.github/actions/setup-env

      - name: Build Packages
        run: pnpm build

      - name: Attest Build Provenance (SLSA Level 3/4)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'packages/*/dist/**'

      - name: Create Release PR or Publish to npm with SLSA Provenance
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docs:
    name: Publish TypeDoc API Reference to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment & Dependencies
        uses: ./.github/actions/setup-env

      - name: Build Packages & Generate Declarations
        run: pnpm build

      - name: Generate TypeDoc API Documentation
        run: pnpm docs:generate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api
